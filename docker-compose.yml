services:

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - gateway-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/gateway_db
      - JWT_SECRET=MyS3cur3S3cr3tK3yF0rJWTT0k3nV4l1d4t10n2024
      - JAVA_OPTS=-Xmx256m -Xms128m
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - gateway-net
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - gateway-net
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  gateway-net:
    driver: bridge